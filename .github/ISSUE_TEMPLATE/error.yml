name: 🐞 Algo no funciona
description: Cuéntanos un error de la app
labels: [bug]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: ¿Qué ha pasado?
      description: Describe el error. Si puedes, añade una captura.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para que vuelva a pasar
      placeholder: |
        1. Entro en un proyecto…
        2. Pulso en…
        3. Aparece…
  - type: textarea
    id: esperado
    attributes:
      label: ¿Qué esperabas que pasara?
  - type: input
    id: dispositivo
    attributes:
      label: Dispositivo y navegador
      placeholder: p. ej. Android 14 + Chrome, iPhone + Safari, Windows + Firefox
